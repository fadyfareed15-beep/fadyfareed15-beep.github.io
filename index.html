<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>محوّل النص إلى PDF</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  body { font-family: Arial, Tahoma, sans-serif; max-width: 700px; margin: 30px auto; padding: 0 16px; }
  textarea { width: 100%; height: 280px; padding: 12px; font-size: 16px; box-sizing: border-box; }
  button { margin-top: 12px; padding: 10px 18px; font-size: 16px; cursor: pointer; }
  #paper { display: none; }
  @media print {
    body > *:not(#paper) { display: none; }
    #paper { display: block; }
  }
</style>
</head>
<body>
  <h2>حوّل النص إلى PDF</h2>
  <textarea id="txt" dir="auto" placeholder="الصقي النص هنا..."></textarea><br>
  <button onclick="download()">تحميل PDF</button>
  <button onclick="printIt()">طباعة / حفظ PDF (نص قابل للتحديد)</button>

  <div id="paper" dir="auto" style="white-space:pre-wrap; font-size:16px; line-height:1.8; padding:20px;"></div>

<script>
  const paper = document.getElementById("paper");
  const txt = document.getElementById("txt");

  function download() {
    if (!txt.value.trim()) return alert("اكتبي نص الأول");
    paper.textContent = txt.value;
    paper.style.display = "block";
    html2pdf().set({
      margin: 15,
      filename: "output.pdf",
      html2canvas: { scale: 2 },
      jsPDF: { unit: "mm", format: "a4" },
      pagebreak: { mode: ["css", "legacy"] }
    }).from(paper).save().then(() => paper.style.display = "none");
  }

  function printIt() {
    if (!txt.value.trim()) return alert("اكتبي نص الأول");
    paper.textContent = txt.value;
    window.print();
  }
</script>
</body>
</html>
