<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>محوّل النص إلى PDF</title>
<style>
  body { font-family: Arial, Tahoma, sans-serif; max-width: 700px; margin: 30px auto; padding: 0 16px; }
  textarea { width: 100%; height: 280px; padding: 12px; font-size: 16px; box-sizing: border-box; }
  button { margin-top: 12px; padding: 10px 18px; font-size: 16px; cursor: pointer; }

  #paper { display: none; }

  @page { size: A4; margin: 15mm; }

  @media print {
    body > *:not(#paper) { display: none !important; }
    body { margin: 0; padding: 0; max-width: none; }
    #paper {
      display: block;
      font-family: Arial, Tahoma, sans-serif;
      font-size: 17pt;
      line-height: 1.7;
      white-space: pre-wrap;
      color: #000;
    }
  }
</style>
</head>
<body>
  <h2>حوّل النص إلى PDF</h2>
  <textarea id="txt" dir="auto" placeholder="الصقي النص هنا..."></textarea><br>
  <button onclick="printIt()">حفظ كـ PDF</button>

  <div id="paper" dir="auto"></div>

<script>
  function printIt() {
    const t = document.getElementById("txt").value;
    if (!t.trim()) return alert("اكتبي نص الأول");
    document.getElementById("paper").textContent = t;
    window.print();
  }
</script>
</body>
</html>
